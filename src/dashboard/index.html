
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hello, world!</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta name="description" content="" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <link rel="icon" href="favicon.png" />
  </head>
    <body style="margin:0; font-family:Inter,system-ui,sans-serif; background:#09090b; color:#fafafa; min-height:100vh; display:grid; place-items:center; overflow:hidden;">
    <style>
        * { box-sizing: border-box; }

        body::before {
        content:"";
        position:fixed;
        width:500px;
        height:500px;
        background:#6366f1;
        filter:blur(160px);
        opacity:.2;
        top:10%;
        left:50%;
        transform:translateX(-50%);
        pointer-events:none;
        }

        .container {
        position:relative;
        width:min(90%,650px);
        text-align:center;
        padding:60px 30px;
        border:1px solid #27272a;
        border-radius:24px;
        background:rgba(24,24,27,.75);
        box-shadow:0 25px 80px rgba(0,0,0,.4);
        }

        .tag {
        display:inline-block;
        padding:7px 14px;
        border:1px solid #3f3f46;
        border-radius:30px;
        color:#a5b4fc;
        background:#312e811c;
        font-size:12px;
        letter-spacing:1px;
        text-transform:uppercase;
        }

        h1 {
        font-size:clamp(42px,8vw,68px);
        letter-spacing:-3px;
        margin:25px 0 15px;
        background:linear-gradient(120deg,#fff,#a5b4fc,#818cf8);
        background-clip:text;
        -webkit-background-clip:text;
        color:transparent;
        }

        p {
        color:#a1a1aa;
        font-size:16px;
        line-height:1.7;
        margin:0 auto 30px;
        max-width:420px;
        }

        .button {
        display:inline-block;
        padding:13px 25px;
        border-radius:12px;
        background:#6366f1;
        color:white;
        text-decoration:none;
        font-weight:600;
        font-size:14px;
        transition:.2s;
        box-shadow:0 5px 25px #6366f144;
        }

        .button:hover {
        background:#818cf8;
        transform:translateY(-3px);
        }

        .footer {
        margin-top:35px;
        color:#52525b;
        font-size:12px;
        }
    </style>

    <main class="container">
        <span class="tag">✦ Your journey starts here</span>

        <h1>Hello, World.</h1>

        <p>
        A little bit of code, a little bit of creativity,
        and a whole lot of possibilities.
        </p>

        <a href="#" class="button">Explore the future →</a>

        <div class="footer">
        MADE WITH ♥ AND A LITTLE BIT OF CSS
        </div>
    </main>
    <script src="script.js"></script>
    </body>
</html>
